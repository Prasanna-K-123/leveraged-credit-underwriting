[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-underwriting-research"
version = "0.1.0"
description = "Source-traceable leveraged-credit underwriting and downside-recovery research"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
